name = "psalm-23-transportation-auth"
main = "worker.mjs"
compatibility_date = "2026-10-14"
workers_dev = true

[vars]
CMS_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"
AUTH_ORIGIN = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev"
REPOSITORY = "YOUR-GITHUB-USERNAME/psalm-23-transportation"
PRIVATE_REPOSITORY = "false"

# Configure ALLOWED_USERS and/or ALLOWED_ADMIN_EMAILS as secrets.
# Configure GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, SESSION_SECRET as secrets.
# Never commit real credentials to this file.
